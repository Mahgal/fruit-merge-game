<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>果园大合成</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fce4ec;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 800px;
      background-color: #fffaf0;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      color: #333;
      font-size: 24px;
      font-weight: bold;
    }
    #game-over {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 10;
    }
    #game-over h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    #game-over p {
      font-size: 24px;
      margin: 5px 0;
    }
    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      pointer-events: auto;
    }
    .btn:active {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
      <div>分数: <span id="score">0</span></div>
    </div>
    <div id="game-over">
      <h1>游戏结束</h1>
      <p>得分: <span id="final-score">0</span></p>
      <p>最高分: <span id="best-score">0</span></p>
      <button class="btn" id="restart-btn">重新开始</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="../core/core.js"></script>
  <script src="game.js"></script>
</body>
</html>
